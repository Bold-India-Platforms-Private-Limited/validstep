name: Deploy Validstep Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          debug: true
          script: |
            set -e
            export PATH=/usr/bin:/usr/local/bin:$PATH

            cd /home/ec2-user/validstep
            git fetch origin main
            git reset --hard origin/main

            cp --remove-destination /home/ec2-user/.secrets/.env.validstep backend/.env
            cd backend
            npm install --omit=dev
            npx prisma generate
            npx prisma migrate deploy

            pm2 reload validstep --update-env
            pm2 save

            echo "✅ Validstep deployed at $(date)"

            # ── Workspace module (interns/projects) ──────────────────────
            # A no-op until /home/ec2-user/.secrets/.env.workspace exists — deliberately
            # not under `set -e`'s blast radius for the block above: a problem here must
            # never take down the validstep deploy that already succeeded.
            if [ -f /home/ec2-user/.secrets/.env.workspace ]; then
              (
                set -e
                cd /home/ec2-user/validstep/workspace/backend
                cp --remove-destination /home/ec2-user/.secrets/.env.workspace .env
                npm install --omit=dev
                npx prisma generate
                npx prisma migrate deploy

                if pm2 describe workspace-backend > /dev/null 2>&1; then
                  pm2 reload workspace-backend --update-env
                else
                  pm2 start ecosystem.config.cjs
                fi
                pm2 save
                echo "✅ Workspace backend deployed at $(date)"
              ) || echo "⚠️  Workspace backend deploy step failed — validstep itself is unaffected, see log above"
            else
              echo "ℹ️  Skipping workspace backend deploy — /home/ec2-user/.secrets/.env.workspace not set up yet"
            fi
